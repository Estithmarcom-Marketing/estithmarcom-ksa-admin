name: Deploy Admin to Production Server
on:
  push:
    branches:
      - production
jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/estithmarcomegypt-sys/estithmarcom-ksa-admin:production
          build-args: |
            VITE_BASE_URL=https://api.estithmarcom.com/api/v1/admin
            VITE_WS_URL=https://api.estithmarcom.com
            VITE_REVERB_APP_KEY=vxtdluqx0w4wc176klh1
            VITE_REVERB_HOST=ws-ksa.estithmarcom.com
            VITE_REVERB_PORT=443
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u estithmarcomegypt-sys --password-stdin
            cd ~/projects/estithmarcom-ksa/admin
            docker compose pull
            docker compose up -d --force-recreate
