name: Deploy Admin to Test Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/estithmarcomegypt-sys/estithmarcom-ksa-admin:latest
          build-args: |
            VITE_API_BASE_URL=https://test.api.estithmarcom.com/api
            VITE_APP_NAME=estithmarcom-ksa Admin
            VITE_APP_ENV=testing

      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u estithmarcomegypt-sys --password-stdin
            cd ~/projects/estithmarcom-ksa/admin
            docker compose pull
            docker compose up -d --force-recreate
