server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — alle Routen zu index.html weiterleiten
    # Warum? React ist eine SPA (Single Page App).
    # Wenn User /dashboard aufruft, kennt Nginx diese Route nicht.
    # Wir schicken ALLES zu index.html → React Router übernimmt dann.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets cachen (JS, CSS, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sicherheit: keine versteckten Dateien zeigen
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
